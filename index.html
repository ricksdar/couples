<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1faf5;--card:#fff;--tx:#23352d;--mu:#6b857a;--pk:#ec5b8f;--gr:#17a673;--ln:#d3eddf;--soft:#fde8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#1a2a22;--tx:#e6f5ec;--mu:#97b5a7;--ln:#2c4439;--soft:#3a2230}}
:root[data-theme="dark"]{--bg:#101a15;--card:#1a2a22;--tx:#e6f5ec;--mu:#97b5a7;--ln:#2c4439;--soft:#3a2230}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}header b{font-size:22px;background:linear-gradient(90deg,var(--gr),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:660px;margin:auto;padding:0 14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 6px;font-size:16px}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.r{display:flex;gap:6px;align-items:center}.r>*{flex:1;min-width:0}.r>.s{flex:0 0 auto}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--pk);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.gn{background:var(--gr)}button.g{background:none;color:var(--mu);padding:4px 8px}
.big{font-size:38px;font-weight:800;line-height:1.1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:11px}nav .on{color:var(--pk)}nav span{display:block;font-size:19px}
.it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it>span{flex:1}
.done{text-decoration:line-through;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--ln);white-space:nowrap;padding:7px 12px}.tabs .on{background:var(--gr);color:#fff;border-color:var(--gr)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--pk))}
.hero{background:linear-gradient(135deg,var(--gr),var(--pk));color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:10px}.cd div{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 0;font-size:11px}.cd b{display:block;font-size:24px}
.card{background:linear-gradient(135deg,var(--pk),#c93a73);color:#fff;border-radius:18px;padding:24px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:600}
.tag{display:inline-block;background:var(--soft);color:var(--pk);border-radius:20px;padding:1px 9px;font-size:12px}
.lk{word-break:break-all;font-size:12px;background:var(--bg);padding:6px;border-radius:8px}
.st0{background:var(--soft)}.st1{background:rgba(245,180,0,.22)}.st2{background:rgba(23,166,115,.22)}label.mu{display:block;font-size:11px}a{color:var(--gr)}.tb{width:100%;border-collapse:collapse;font-size:12px}.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}.pg{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}.pg h2{margin:0}.pg h3{margin:16px 0 4px}
@media print{:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--ln:#bbb}header,nav,.tabs,.noprint{display:none!important}body{padding:0;font-size:12px}main{max-width:none;padding:0}.pg{border:0;padding:0;border-radius:0}.pg .tb{font-size:11px}.pg tr{break-inside:avoid}.pg h3{break-after:avoid}}
