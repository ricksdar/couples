<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1faf5;--card:#fff;--tx:#23352d;--mu:#6b857a;--pk:#ec5b8f;--gr:#17a673;--ln:#d3eddf;--soft:#fde8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#1a2a22;--tx:#e6f5ec;--mu:#97b5a7;--ln:#2c4439;--soft:#3a2230}}
:root[data-theme="dark"]{--bg:#101a15;--card:#1a2a22;--tx:#e6f5ec;--mu:#97b5a7;--ln:#2c4439;--soft:#3a2230}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}header b{font-size:22px;background:linear-gradient(90deg,var(--gr),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:660px;margin:auto;padding:0 14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 6px;font-size:16px}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.r{display:flex;gap:6px;align-items:center}.r>*{flex:1;min-width:0}.r>.s{flex:0 0 auto}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--pk);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.gn{background:var(--gr)}button.g{background:none;color:var(--mu);padding:4px 8px}
.big{font-size:38px;font-weight:800;line-height:1.1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:11px}nav .on{color:var(--pk)}nav span{display:block;font-size:19px}
.it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it>span{flex:1}
.done{text-decoration:line-through;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--ln);white-space:nowrap;padding:7px 12px}.tabs .on{background:var(--gr);color:#fff;border-color:var(--gr)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--pk))}
.hero{background:linear-gradient(135deg,var(--gr),var(--pk));color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:10px}.cd div{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 0;font-size:11px}.cd b{display:block;font-size:24px}
.card{background:linear-gradient(135deg,var(--pk),#c93a73);color:#fff;border-radius:18px;padding:24px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:600}
.tag{display:inline-block;background:var(--soft);color:var(--pk);border-radius:20px;padding:1px 9px;font-size:12px}
.lk{word-break:break-all;font-size:12px;background:var(--bg);padding:6px;border-radius:8px}

const VQG={'Kontrak':['Apa yang termasuk dan tidak termasuk?','Ada pajak dan service charge?','Bagaimana kalau jumlah tamu berubah?','Berapa biaya overtime per jam?','Bagaimana syarat batal dan pengembalian DP?','Siapa penanggung jawab hari H?','Apakah semua perubahan akan tertulis?'],
'WO':['Apa saja yang di-handle oleh WO?','Apakah WO hanya hari H atau dari persiapan awal?','Berapa jumlah crew yang standby saat acara?','Apakah WO membantu timeline rundown acara?','Apakah WO membantu koordinasi semua vendor?','Bagaimana sistem komunikasi selama persiapan?','Apakah WO membantu budgeting?','Bagaimana antisipasi jika ada kendala di hari H?','Apakah WO pernah handle venue yang sama?','Apakah ada PIC khusus untuk pengantin?','Bagaimana SOP jika acara molor?','Apakah ada biaya overtime?','Kapan WO mulai aktif bekerja sebelum acara?','Bagaimana sistem pembayaran?'],
'Dekorasi':['Tema dekorasi apa saja yang bisa dibuat?','Apakah dekorasi bisa custom sesuai referensi saya?','Paket dekorasi mencakup area mana saja?','Apakah pelaminan, aisle, welcome gate termasuk?','Bunga yang digunakan fresh atau artificial?','Apakah ada mockup / visual design sebelum deal?','Kapan proses loading dan setup dilakukan?','Berapa lama waktu instalasi?','Apakah dekorasi disesuaikan dengan venue?','Bagaimana jika ada revisi desain?','Apakah ada biaya tambahan untuk request khusus?','Siapa yang standby saat hari H?','Apakah ada biaya bongkar dekorasi?','Bagaimana sistem pembayaran?'],
'Catering':['Menu apa saja yang tersedia untuk paket pernikahan?','Apakah bisa custom menu?','Berapa porsi per paket?','Sistem hitung tamu seperti apa (per pax atau buffet)?','Apakah ada food testing?','Apakah ada menu khusus vegetarian atau dietary restrictions?','Bagaimana estimasi porsi agar tidak kurang?','Apakah sudah termasuk stall makanan tambahan?','Peralatan makan dan serving table termasuk?','Berapa jumlah waiter yang disediakan?','Bagaimana handling makanan agar tetap fresh selama acara?','Apakah ada minimum order?','Bagaimana jika tamu melebihi estimasi?','Apakah ada charge untuk service dan kebersihan?'],
'Venue':['Berapa kapasitas maksimal tamu (duduk dan berdiri)?','Fasilitas apa yang sudah termasuk (dekorasi dasar, sound, AC, listrik)?','Apakah boleh membawa vendor luar, dan ada biaya tambahannya?','Berapa durasi sewa dan berapa biaya overtime?','Apa aturan gedung (jam load-in, batas dekorasi, larangan tertentu)?','Bagaimana akses transportasi dan kapasitas parkir?','Apakah ada pajak atau service charge di luar harga sewa?','Bagaimana syarat DP, pembatalan, dan jadwal ulang?','Apakah ada ruang rias dan genset cadangan?'],
'Dokumentasi':['Berapa jam liputan dan berapa biaya overtime?','Berapa fotografer dan videografer yang bertugas?','Berapa lama hasil edit selesai dikirim?','Apa saja hasil akhirnya (foto edit, video highlight, file mentah)?','Bagaimana hak penggunaan hasil (boleh dipublikasikan)?','Apakah ada biaya transport atau akomodasi?','Bagaimana jika fotografer berhalangan hadir?','Bagaimana syarat DP dan pembatalan?'],
'MUA':['Apakah ada tes rias dan berapa biayanya?','Berapa orang yang dirias dan biaya tambahan per orang?','Jam berapa mulai merias dan berapa lama?','Apakah transport atau akomodasi sudah termasuk?','Produk apa yang dipakai, aman untuk kulit sensitif atau hijab?','Apakah ada touch-up saat acara berlangsung?','Bagaimana syarat DP dan pembatalan?'],
'MC & Hiburan':['Berapa durasi tampil dan biaya overtime?','Apakah menerima rundown dan permintaan segmen atau lagu khusus?','Membawa peralatan sendiri atau memakai sound venue?','Bagaimana jika berhalangan hadir (pengganti)?','Apakah ada biaya transport?','Bagaimana syarat DP dan pembatalan?']};
const VQX=['Venue','Dokumentasi','MUA','MC & Hiburan'],VGS=Object.keys(VQG);let vgi=0,vo_='';
function vq_(){const g=VGS[vgi],items=G=>[...VQG[G].map((t,i)=>({id:G+i,t})),...(S.vx||[]).filter(x=>x.g==G)],cnt=G=>{const a=items(G);return a.filter(x=>S.vq[x.id]).length+'/'+a.length};
let h=`<div class="tabs">${VGS.map((G,i)=>`<button class="${vgi==i?'on':''}" onclick="vgi=${i};vo_='';draw()">${E(G)} ${cnt(G)}</button>`).join('')}</div><div class="c"><h3>${g=='Kontrak'?'Sebelum tanda tangan kontrak (semua vendor)':'Pertanyaan untuk '+E(g)}</h3><div class="mu">${VQX.includes(g)?'Pertanyaan tambahan dari saya (belum ada di sheet referensi).':'Centang setelah vendor menjawab; ketuk 📝 untuk mencatat jawabannya.'}</div>`;
h+=items(g).map(x=>{const n=S.vqn[x.id]||'';return `<div class="it" style="align-items:flex-start"><input type="checkbox" style="width:auto;margin-top:4px" ${S.vq[x.id]?'checked':''} onchange="S.vq['${x.id}']=this.checked?1:0;rd()"><span class="${S.vq[x.id]?'done':''}">${E(x.t)}${n&&vo_!=x.id?`<br><span class="mu">${E(n)}</span>`:''}${vo_==x.id?`<input placeholder="Jawaban vendor / catatan" value="${E(n)}" onchange="S.vqn['${x.id}']=this.value;rd()">`:''}</span><button class="g" onclick="vo_=vo_=='${x.id}'?'':'${x.id}';draw()">📝</button>${x.id[0]=='x'?`<button class="g" onclick="S.vx=S.vx.filter(y=>y.id!='${x.id}');rd()">×</button>`:''}</div>`}).join('')+'</div>';
return h+`<div class="c"><h3>Tambah Pertanyaan (${E(g)})</h3><div class="r"><input id="vqt" placeholder="Pertanyaan baru"><button class="s" onclick="if(v('vqt')){S.vx.push({id:'x'+Date.now(),g:VGS[vgi],t:v('vqt')});rd()}">+</button></div><div class="mu">Centang berlaku untuk satu daftar saja; kalau membandingkan beberapa vendor, catat jawaban tiap vendor di kolom catatan.</div></div>`}
const VCK=['Lokasi','Akses transportasi','Aturan gedung','Fasilitas termasuk','Biaya tambahan'],VF=[['sw','Sewa venue'],['lg','Logistik tambahan (sound, lighting, dekor)'],['tr','Transport vendor'],['lu','Vendor luar (karena aturan gedung)'],['la','Biaya lain']];
function vnu(){const V=S.vc,tot=x=>VF.reduce((a,[k])=>a+(+x[k]||0),0),mx=Math.max(1,...V.map(tot)),mn=V.length>1?Math.min(...V.map(tot)):null;
let h=`<div class="c"><h3>Bandingkan Total Biaya Venue</h3><div class="mu">Harga sewa murah bisa jadi mahal bila ada logistik, transport vendor, atau vendor luar. Bandingkan totalnya, bukan harga sewa saja.</div>`+(V.length?V.map(x=>{const t=tot(x);return `<div class="mu" style="margin-top:8px"><b>${E(x.n)}</b> ${V.length>1&&t==mn?'<span class="tag">Termurah (total)</span>':''} · ${Rp(t)}${t>(+x.sw||0)&&x.sw?' (+'+Rp(t-x.sw)+' di atas sewa)':''}</div><div class="bar"><i style="width:${t/mx*100}%"></i></div>`}).join(''):'<div class="mu" style="margin-top:6px">Belum ada venue. Tambahkan di bawah.</div>')+'</div>';
h+=V.map((x,i)=>`<div class="c"><div class="r"><b>${E(x.n)}</b><button class="g s" onclick="S.venue=S.vc[${i}].n;rd()">Pilih sebagai venue</button><button class="g s" onclick="S.vc.splice(${i},1);rd()">×</button></div><label class="mu">Kapasitas (orang)<input type="number" value="${x.cap||''}" onchange="S.vc[${i}].cap=+this.value||0;rd()"></label>`+VF.map(([k,l])=>`<label class="mu">${l}<input type="number" value="${x[k]||''}" onchange="S.vc[${i}].${k}=+this.value||0;rd()"></label>`).join('')+`<div class="it"><span><b>Total biaya</b></span><b style="color:var(--pk)">${Rp(tot(x))}</b></div><div class="mu">Sudah dicek:</div>`+VCK.map((l,j)=>`<label class="mu" style="display:inline-block;margin-right:10px"><input type="checkbox" style="width:auto" ${x.ck[j]?'checked':''} onchange="S.vc[${i}].ck[${j}]=this.checked?1:0;sv()"> ${l}</label>`).join('')+`<input placeholder="Catatan (apa saja yang termasuk)" value="${E(x.note)}" onchange="S.vc[${i}].note=this.value;sv()"></div>`).join('');
return h+`<div class="c"><h3>Tambah Venue</h3><div class="r"><input id="vnn" placeholder="Nama venue"><button class="s" onclick="if(v('vnn')){S.vc.push({n:v('vnn'),cap:0,sw:0,lg:0,tr:0,lu:0,la:0,note:'',ck:[0,0,0,0,0]});rd()}">+</button></div></div>`}
function addG(){if(!v('gn_'))return;S.gst.push({n:v('gn_'),pax:+v('gp')||1,s:'Belum'});rd()}
function sync(){return `<div class="c"><h3>Sinkron 2 Perangkat</h3>${SB.url?'':'<div class="mu">⚠ Supabase belum dikonfigurasi (SB.url / SB.key kosong). Data hanya tersimpan di perangkat ini.</div>'}${S._c?`<p>Kode pasangan:</p><div class="lk">${S._c}</div><div class="mu">Kode ini kunci akses data kalian. Jangan dibagikan ke orang lain. Versi: ${S._v}</div><button onclick="if(confirm('Putus sinkron di perangkat ini?')){S._c='';S._v=0;rd()}">Putuskan</button>`:`<button class="gn" onclick="mkc()">Buat kode baru (perangkat pertama)</button><div class="r" style="margin-top:8px"><input id="jc" placeholder="Tempel kode dari pasangan"><button class="s" onclick="jn()">Gabung</button></div>`}<div class="mu" style="margin-top:8px">Bentrok edit: versi terbaru menang. Sinkron tiap ±12 detik.</div></div>`}
async function mkc(){if(!SB.url)return alert('Isi konfigurasi Supabase dulu.');S._c=rnd(26);S._v=0;await push();if(!S._v){S._c='';alert('Gagal terhubung ke server. Coba lagi nanti.')}draw()}
async function jn(){const c=v('jc').trim();if(!SB.url||c.length<20)return alert('Kode tidak valid');try{const r=await rpc('couples_get',{p_code:c});if(!r)return alert('Kode tidak ditemukan');Object.assign(S,r.data,{_c:c,_v:r.ver});rd()}catch(e){alert('Gagal terhubung')}}
